<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원티드 백엔드 언어 분석</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components/button.css">
  <link rel="stylesheet" href="/css/components/progress.css">
  <link rel="stylesheet" href="/css/components/table.css">
</head>
<body>
<div class="container">
  <header class="hero">
    <div class="hero-badge">Wanted · 백엔드</div>
    <h1>기술 스택 트렌드 분석</h1>
    <p class="subtitle">데이터·AI·인프라 공고 제외 &mdash; 백엔드 공고만 실시간 분석</p>
    <div class="btn-row">
      <button id="btn" onclick="startScrape(false)">
        <span id="btn-text">분석 시작</span>
      </button>
      <button id="btn-refresh" class="btn-secondary" onclick="startScrape(true)" style="display:none">
        새로 분석
      </button>
    </div>
    <p id="last-refreshed" class="last-refreshed" style="display:none">최근 새로고침: <strong id="last-refreshed-time"></strong></p>
  </header>

  <div class="notice">
    분석 결과는 <strong>참고용으로만 활용하세요.</strong>
  </div>

  <div id="status-box" style="display:none">
    <p class="status-text" id="status-text">준비 중...</p>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="status-footer">
      <span class="eta" id="eta-text"></span>
      <span class="meta" id="meta-text"></span>
    </div>
  </div>

  <div id="error-box"></div>

  <div id="summary-box"></div>

  <div id="result-box" style="display:none">
    <table>
      <thead>
        <tr>
          <th style="width:52px">#</th>
          <th>언어 / 기술</th>
          <th style="width:120px">공고 수</th>
          <th>비율</th>
        </tr>
      </thead>
      <tbody id="result-body"></tbody>
    </table>
  </div>
</div>

<script src="/js/scrape.js"></script>
</body>
</html>

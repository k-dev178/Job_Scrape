<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원티드 백엔드 언어 분석</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components/button.css">
  <link rel="stylesheet" href="/css/components/progress.css">
  <link rel="stylesheet" href="/css/components/table.css">
</head>
<body>
<div class="container">
  <h1>원티드 백엔드 언어 분석</h1>
  <p class="subtitle">데이터/AI/인프라 공고 제외 · 백엔드 공고만 분석</p>

  <button id="btn" onclick="startScrape()">스크래핑 시작</button>

  <div id="status-box">
    <p class="status-text" id="status-text">준비 중...</p>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <p class="eta" id="eta-text"></p>
    <p class="meta" id="meta-text"></p>
  </div>

  <div id="error-box"></div>

  <div id="result-box">
    <table>
      <thead>
        <tr><th>#</th><th>언어 / 기술</th><th>언급 공고수</th><th>비율</th></tr>
      </thead>
      <tbody id="result-body"></tbody>
    </table>
  </div>
</div>

<script src="/js/scrape.js"></script>
</body>
</html>

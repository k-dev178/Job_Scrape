<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백엔드 공고 기술스택 분석</title>
  <meta name="description" content="백엔드 채용공고를 스크랩해 언어와 기술스택 통계를 보여주는 사이트">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css?v=3">
  <link rel="stylesheet" href="/css/components/button.css?v=2">
  <link rel="stylesheet" href="/css/components/progress.css?v=2">
  <link rel="stylesheet" href="/css/components/modal.css?v=2">
  <link rel="stylesheet" href="/css/components/table.css?v=2">
</head>
<body>
<div class="container">
  <header class="hero">
    <div class="hero-badge">백엔드 채용공고</div>
    <h1>기술 스택 트렌드 분석</h1>
    <p id="source-description" class="subtitle">Wanted·잡코리아·사람인 백엔드 공고를 통합 분석</p>
    <div class="source-toggle" role="group" aria-label="분석 소스">
      <button type="button" class="source-option active" data-source="all" aria-pressed="true" onclick="selectSource('all')">전체</button>
      <button type="button" class="source-option" data-source="wanted" aria-pressed="false" onclick="selectSource('wanted')">Wanted</button>
      <button type="button" class="source-option" data-source="jobkorea" aria-pressed="false" onclick="selectSource('jobkorea')">잡코리아</button>
      <button type="button" class="source-option" data-source="saramin" aria-pressed="false" onclick="selectSource('saramin')">사람인</button>
    </div>
    <div class="btn-row">
      <button id="btn" onclick="startScrape(false)">
        <span id="btn-text">분석 시작</span>
      </button>
      <button id="btn-refresh" class="btn-secondary" onclick="startScrape(true)" style="display:none">
        새로고침
      </button>
      <button id="btn-career" class="btn-filter" onclick="openCareerModal()">
        <span id="btn-career-text">경력 전체</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <p id="last-refreshed" class="last-refreshed" style="display:none">최근 새로고침: <strong id="last-refreshed-time"></strong></p>

<!-- 경력 모달 -->
<div id="career-overlay" class="modal-overlay" onclick="closeCareerModal()" style="display:none"></div>
<div id="career-modal" class="modal" style="display:none">
  <div class="modal-header">
    <span class="modal-title">경력</span>
    <button class="modal-close" onclick="closeCareerModal()">✕</button>
  </div>
  <div class="modal-body">
    <p id="career-label" class="career-label">경력 전체</p>
    <div class="range-wrap">
      <div class="range-track">
        <div class="range-fill" id="range-fill"></div>
      </div>
      <input type="range" id="range-min" min="0" max="10" value="0" oninput="onRangeChange()">
      <input type="range" id="range-max" min="0" max="10" value="10" oninput="onRangeChange()">
    </div>
    <div class="range-labels">
      <span>신입</span>
      <span>10년 이상</span>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-secondary" onclick="resetCareer()">초기화</button>
    <button id="btn-apply" onclick="applyCareer()">적용</button>
  </div>
</div>
  </header>

  <div class="notice">
    분석 결과는 <strong>참고용으로만 활용하세요.</strong>
  </div>

  <div id="status-box" style="display:none">
    <p class="status-text" id="status-text">준비 중...</p>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="status-footer">
      <span class="eta" id="eta-text"></span>
      <span class="meta" id="meta-text"></span>
    </div>
    <button id="btn-dismiss" onclick="document.getElementById('status-box').style.display='none'" style="display:none">확인</button>
  </div>

  <div id="error-box"></div>

  <div id="summary-box"></div>

  <div id="result-box" style="display:none">
    <table>
      <thead>
        <tr>
          <th style="width:52px">#</th>
          <th>언어 / 기술</th>
          <th style="width:120px">공고 수</th>
          <th>비율</th>
        </tr>
      </thead>
      <tbody id="result-body"></tbody>
    </table>
  </div>

  <section id="job-list-box" class="job-list-box" aria-live="polite" style="display:none">
    <div class="job-list-header">
      <div>
        <p class="job-list-kicker">선택한 기술</p>
        <h2 id="job-list-title">공고 목록</h2>
      </div>
      <button id="job-list-close" type="button" aria-label="공고 목록 닫기">✕</button>
    </div>
    <div id="job-list-body" class="job-list-body"></div>
  </section>
</div>

<script src="/js/scrape.js?v=4"></script>
<script src="/js/career.js?v=2"></script>
</body>
</html>

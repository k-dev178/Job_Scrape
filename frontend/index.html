<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원티드 백엔드 언어 분석</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components/button.css">
  <link rel="stylesheet" href="/css/components/progress.css">
  <link rel="stylesheet" href="/css/components/modal.css">
  <link rel="stylesheet" href="/css/components/table.css">
</head>
<body>
<div class="container">
  <header class="hero">
    <div class="hero-badge">Wanted · 백엔드</div>
    <h1>기술 스택 트렌드 분석</h1>
    <p class="subtitle">데이터·AI·인프라 공고 제외 &mdash; 백엔드 공고만 실시간 분석</p>
    <div class="btn-row">
      <button id="btn" onclick="startScrape(false)">
        <span id="btn-text">분석 시작</span>
      </button>
      <button id="btn-refresh" class="btn-secondary" onclick="startScrape(true)" style="display:none">
        새로고침
      </button>
      <button id="btn-career" class="btn-filter" onclick="openCareerModal()">
        <span id="btn-career-text">경력 전체</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <p id="last-refreshed" class="last-refreshed" style="display:none">최근 새로고침: <strong id="last-refreshed-time"></strong></p>

<!-- 경력 모달 -->
<div id="career-overlay" class="modal-overlay" onclick="closeCareerModal()" style="display:none"></div>
<div id="career-modal" class="modal" style="display:none">
  <div class="modal-header">
    <span class="modal-title">경력</span>
    <button class="modal-close" onclick="closeCareerModal()">✕</button>
  </div>
  <div class="modal-body">
    <p id="career-label" class="career-label">경력 전체</p>
    <div class="range-wrap">
      <div class="range-track">
        <div class="range-fill" id="range-fill"></div>
      </div>
      <input type="range" id="range-min" min="0" max="10" value="0" oninput="onRangeChange()">
      <input type="range" id="range-max" min="0" max="10" value="10" oninput="onRangeChange()">
    </div>
    <div class="range-labels">
      <span>신입</span>
      <span>10년 이상</span>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-secondary" onclick="resetCareer()">초기화</button>
    <button id="btn-apply" onclick="applyCareer()">적용</button>
  </div>
</div>
  </header>

  <div class="notice">
    분석 결과는 <strong>참고용으로만 활용하세요.</strong>
  </div>

  <div id="status-box" style="display:none">
    <p class="status-text" id="status-text">준비 중...</p>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="status-footer">
      <span class="eta" id="eta-text"></span>
      <span class="meta" id="meta-text"></span>
    </div>
    <button id="btn-dismiss" onclick="document.getElementById('status-box').style.display='none'" style="display:none">확인</button>
  </div>

  <div id="error-box"></div>

  <div id="summary-box"></div>

  <div id="result-box" style="display:none">
    <table>
      <thead>
        <tr>
          <th style="width:52px">#</th>
          <th>언어 / 기술</th>
          <th style="width:120px">공고 수</th>
          <th>비율</th>
        </tr>
      </thead>
      <tbody id="result-body"></tbody>
    </table>
  </div>
</div>

<script src="/js/scrape.js"></script>
<script src="/js/career.js"></script>
</body>
</html>
